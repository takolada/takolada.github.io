<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio of Fawaz Amajida — No Tailwind</title>
  <!-- Removed Tailwind. Using vanilla CSS. -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-1: #f9fafb;
      --bg-2: #e5e7eb;
      --fg: #0f172a; /* slate-900-ish */
      --muted: #475569; /* slate-600 */
      --primary: #1d4ed8; /* blue-700 */
      --primary-600: #2563eb; /* blue-600 */
      --primary-800: #1e40af; /* blue-800 */
      --accent: #7c3aed; /* purple-700 */
      --chip-bg: #e0e7ff; /* indigo-100 */
      --chip-bg-hover: #c7d2fe; /* indigo-200 */
      --chip-fg: #3730a3; /* indigo-800 */
      --ok: #22c55e; /* green-500 */
      --warn: #eab308; /* yellow-500 */
      --danger: #ef4444; /* red-500 */
      --card: #ffffff;
      --shadow-lg: 0 20px 25px -5px rgba(0,0,0,0.1);
      --shadow: 0 5px 15px rgba(0,0,0,0.1);
      --radius-xl: 1.5rem;
      --radius-lg: 1rem;
      --radius-full: 999px;
      --trans: 180ms cubic-bezier(.2,.8,.2,1);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--fg);
      background: linear-gradient(135deg, var(--bg-1), var(--bg-2), var(--bg-1));
      background-size: 300% 300%;
      animation: movingBackground 15s ease infinite alternate;
      overflow-x: hidden;
      min-height: 100vh;
      margin: 0;
    }

    @keyframes movingBackground {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Layout sections */
    .section-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 4rem 1.25rem;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity .8s ease-out, transform .8s ease-out;
    }
    .section-container.is-visible { opacity: 1; transform: translateY(0); }

    .project-section {
      background: var(--card);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-lg);
      padding: 2.5rem;
      max-width: 900px;
      width: 95%;
      margin-bottom: 2rem;
    }

    /* Buttons */
    .btn { cursor: pointer; display: inline-block; font-weight: 700; border: 0; transition: transform var(--trans), background var(--trans), color var(--trans), box-shadow var(--trans); }
    .btn:focus { outline: 3px solid rgba(37, 99, 235, .35); outline-offset: 2px; }

    .btn-pill { border-radius: var(--radius-full); padding: .9rem 1.6rem; }
    .btn-md { border-radius: 12px; padding: .8rem 1.2rem; }

    .btn-primary { background: #fff; color: var(--primary); box-shadow: var(--shadow); }
    .btn-primary:hover { background: #f3f4f6; }

    .btn-accent { background: #fff; color: var(--accent); box-shadow: var(--shadow); }
    .btn-accent:hover { background: #f3f4f6; }

    .btn-solid { background: var(--primary-600); color: #fff; }
    .btn-solid:hover { background: var(--primary-800); }

    .btn-ghost { background: #e5e7eb; color: #374151; }
    .btn-ghost:hover { background: #d1d5db; }

    /* Chips */
    .chip { display:inline-block; background: var(--chip-bg); color: var(--chip-fg); font-weight: 600; border-radius: 999px; padding: .35rem .8rem; margin: 0 .4rem .5rem 0; border: 0; cursor: pointer; transition: background var(--trans), transform var(--trans); }
    .chip:hover { background: var(--chip-bg-hover); transform: translateY(-1px); }
    .chip.is-active { background: var(--primary-600); color: #fff; }

    /* Typography */
    h1 { font-size: clamp(2rem, 5vw, 3.75rem); margin: 0 0 .5rem; font-weight: 800; }
    h2 { font-size: clamp(1.75rem, 4vw, 3rem); margin: 0 0 1rem; font-weight: 800; color: var(--primary-800); }
    h3 { font-size: clamp(1.35rem, 3vw, 2rem); margin: 0 0 1rem; font-weight: 800; color: var(--primary-800); }
    p.lead { font-size: clamp(1rem, 2.3vw, 1.35rem); color: #374151; max-width: 60ch; }
    .muted { color: var(--muted); }

    /* Hero */
    .hero { text-align: center; }
    .avatar { width: 13rem; height: 13rem; border-radius: 50%; object-fit: cover; box-shadow: 0 25px 50px -12px rgba(0,0,0,.25); border: 4px solid #fff; margin: 0 auto 2rem; display:block; }
    .hero-actions { display:flex; gap: 1rem; justify-content: center; flex-wrap: wrap; margin-top: 1rem; }

    /* Project nav & grid */
    #projects-nav { background: rgba(59,130,246,.08); }

    .toolbar { display:flex; gap:.5rem; align-items:center; justify-content:center; margin: 1rem 0 1.25rem; flex-wrap: wrap; }
    .search { display:flex; gap:.5rem; width:100%; max-width: 640px; }
    .search input { flex: 1; border: 1px solid #d1d5db; border-radius: 14px; padding: .85rem 1rem; font-size: 1rem; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
    .search input:focus { outline: 3px solid rgba(37,99,235,.35); border-color: var(--primary-600); }

    .grid { display: grid; grid-template-columns: repeat(1, minmax(0, 1fr)); gap: 1rem; width: 100%; max-width: 1100px; padding: 0 1rem; margin: 0 auto; }
    @media (min-width: 640px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (min-width: 1024px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

    .scroll-button { background: var(--primary-800); color:#fff; border:0; border-radius: 14px; padding: 1rem 1.2rem; font-weight: 700; box-shadow: var(--shadow); transition: transform var(--trans), box-shadow var(--trans), filter var(--trans); }
    .scroll-button:hover { transform: translateY(-2px); filter: brightness(1.05); }
    .scroll-button.highlighted { outline: 3px solid rgba(37, 99, 235, .55); outline-offset: 2px; transform: scale(1.03); }

    /* Slideshows */
    .slideshow-container { position: relative; margin: 1.5rem auto; max-width: 700px; overflow: hidden; border-radius: var(--radius-lg); box-shadow: var(--shadow); background: #000; }
    .mySlides { display: none; width: 100%; height: auto; }
    .nav-arrow { cursor: pointer; position: absolute; top: 50%; transform: translateY(-50%); padding: 12px; color: #fff; font-weight: 800; font-size: 18px; background: rgba(0,0,0,.6); border-radius: 6px; user-select: none; border: 0; }
    .nav-arrow.prev { left: 6px; }
    .nav-arrow.next { right: 6px; }

    /* Iframe embeds */
    .embed-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; margin-top: 1.25rem; border-radius: var(--radius-lg); box-shadow: var(--shadow); background: #111; }
    .embed-container iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

    /* Progress bar */
    #scroll-progress { position: fixed; top: 0; left: 0; height: .5rem; width: 0; z-index: 50; border-top-right-radius: 999px; border-bottom-right-radius: 999px; transition: width 75ms linear; cursor: pointer; }

    /* Tooltip */
    #scrub-tooltip { position: fixed; top: .75rem; padding: .3rem .5rem; font-size: .8rem; background: #000; color: #fff; border-radius: 6px; box-shadow: var(--shadow); opacity: 0; pointer-events: none; transition: opacity var(--trans); white-space: nowrap; }
    #scrub-tooltip.is-visible { opacity: 1; pointer-events: auto; cursor: pointer; }

    /* Back to top */
    #back-to-top { position: fixed; bottom: 1.2rem; right: 1.2rem; background: var(--primary-600); color: #fff; border: 0; border-radius: var(--radius-full); padding: .8rem 1rem; box-shadow: var(--shadow); transform: scale(1); transition: transform var(--trans), opacity var(--trans), filter var(--trans); opacity: 0; pointer-events: none; }
    #back-to-top:hover { transform: scale(1.08); filter: brightness(1.05); }
    #back-to-top.is-visible { opacity: 1; pointer-events: auto; }

    @keyframes softPulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.08); opacity: 0.9; } }
    .animate-soft-pulse { animation: softPulse 1.5s infinite; }

    /* Utility */
    .center { text-align: center; }
    .w-95 { width: 95%; }
  </style>
</head>
<body>

  <!-- Scroll Progress Bar -->
  <div id="scroll-progress" aria-hidden="true"></div>
  <!-- Scrubber Tooltip -->
  <div id="scrub-tooltip"></div>

  <!-- Hero -->
  <section id="hero" class="section-container hero">
    <img src="Assets/profile.jpg" alt="Fawaz Amajida" class="avatar" />
    <h1>Fawaz Amajida</h1>
    <p class="lead">A passionate Mechanical Engineer from Institut Teknologi Bandung, specializing in Engineering Design, Robotics, and Machine Learning.</p>
    <div class="hero-actions">
      <a class="btn btn-pill btn-primary" href="https://www.linkedin.com/in/fawazamajida" target="_blank" rel="noopener">LinkedIn Profile</a>
      <a class="btn btn-pill btn-accent" href="#projects">View Projects</a>
    </div>
  </section>

  <!-- Project Navigation + Filters -->
  <section id="projects-nav" class="section-container">
    <h2 class="center">Explore My Work & Experiences</h2>

    <div class="toolbar search" role="search">
      <input id="project-search" type="text" placeholder="Search projects or skills... (press / to focus)" aria-label="Search projects" />
      <button id="clear-filters" class="btn btn-md btn-ghost" style="display:none">Clear</button>
    </div>

    <div id="category-filters" class="toolbar" aria-label="Category filters"></div>

    <div id="projects-buttons" class="grid"></div>
  </section>

  <!-- Projects Sections -->
  <div id="projects-container"></div>

  <!-- Back to Top Button -->
  <button id="back-to-top" title="Back to top">↑</button>

  <script>
    let allProjects = [];
    let activeCategory = null;
    let searchResults = [];
    let highlightedIndex = -1;
    let tooltipTargetSection = null;

    // Load projects
    async function loadProjects() {
      const res = await fetch('projects.json');
      allProjects = await res.json();
      renderCategoryFilters(allProjects);
      renderProjects(allProjects);
    }

    // Render category buttons
    function renderCategoryFilters(projects) {
      const filterContainer = document.getElementById('category-filters');
      filterContainer.innerHTML = '';

      const categories = new Set();
      projects.forEach(p => (p.categories || []).forEach(c => categories.add(c)));

      const allBtn = document.createElement('button');
      allBtn.className = 'chip is-active';
      allBtn.textContent = 'All';
      allBtn.onclick = () => filterByCategory(null);
      filterContainer.appendChild(allBtn);

      categories.forEach(cat => {
        const b = document.createElement('button');
        b.className = 'chip';
        b.textContent = cat;
        b.onclick = () => filterByCategory(cat);
        filterContainer.appendChild(b);
      });
    }

    // Filter by category
    function filterByCategory(cat) {
      activeCategory = cat;
      const query = document.getElementById('project-search').value.toLowerCase();

      const filtered = allProjects.filter(p => {
        const matchesText =
          p.title.toLowerCase().includes(query) ||
          (p.skills && p.skills.toLowerCase().includes(query)) ||
          (p.categories && p.categories.some(c => c.toLowerCase().includes(query)));
        const matchesCategory = !cat || (p.categories && p.categories.includes(cat));
        return matchesText && matchesCategory;
      });

      renderProjects(filtered);

      // Toggle chip active styles
      const chips = document.querySelectorAll('#category-filters .chip');
      chips.forEach(ch => ch.classList.remove('is-active'));
      if (cat === null) {
        chips[0]?.classList.add('is-active');
      } else {
        [...chips].forEach(ch => { if (ch.textContent.trim() === cat) ch.classList.add('is-active'); });
      }

      updateClearButton();
    }

    // Render projects
    function renderProjects(projects) {
      const buttons = document.getElementById('projects-buttons');
      const container = document.getElementById('projects-container');
      buttons.innerHTML = '';
      container.innerHTML = '';

      projects.forEach(p => {
        // index buttons
        const btn = document.createElement('button');
        btn.className = 'scroll-button';
        btn.textContent = p.title;
        btn.onclick = () => document.getElementById(p.id).scrollIntoView({ behavior: 'smooth' });
        buttons.appendChild(btn);

        // sections
        if (!p.organizations) {
          const embedsHTML = (p.embeds || []).map(url => `
            <div class="embed-container">
              <iframe src="${url}" allowfullscreen></iframe>
            </div>`).join('');

          let imagesHTML = '';
          if (p.images && p.images.length > 0) {
            imagesHTML = `
              <div class="slideshow-container" id="${p.id}-slideshow">
                ${p.images.map(img => `<img class=\"mySlides\" src=\"${img}\" alt=\"${p.title}\">`).join('')}
                <button class="nav-arrow prev" onclick="plusSlides(-1, '${p.id}-slideshow')">❮</button>
                <button class="nav-arrow next" onclick="plusSlides(1, '${p.id}-slideshow')">❯</button>
              </div>
            `;
          }

          const categoryHTML = (p.categories || []).map(cat => `
            <button class="chip" onclick="filterByCategory('${cat}')">${cat}</button>
          `).join('');

          let linksHTML = '';
          if (p.links && p.links.length > 0) {
            linksHTML = `
              <div style="display:flex;flex-wrap:wrap;gap:.6rem;margin-bottom:1rem;">
                ${p.links.map(link => `
                  <a class="btn btn-md btn-solid" href="${link.url}" target="_blank" rel="noopener">${link.label}</a>
                `).join('')}
              </div>
            `;
          }

          container.insertAdjacentHTML('beforeend', `
            <section id="${p.id}" class="section-container" aria-label="${p.title}">
              <div class="project-section">
                <h3>${p.title}</h3>
                <div class="muted" style="font-weight:600;margin-bottom:.5rem;">Skills: ${p.skills || ''}</div>
                <p class="muted" style="margin-bottom:1rem;">${p.description || ''}</p>
                <div style="display:flex;flex-wrap:wrap;margin-bottom:1rem;">${categoryHTML}</div>
                ${linksHTML}
                ${embedsHTML}
                ${imagesHTML}
              </div>
            </section>
          `);
        } else {
          const orgsHTML = p.organizations.map(org => `
            <div class="organizational-experience-item" style="margin-bottom:2rem;padding-bottom:1rem;border-bottom:1px solid #e5e7eb;">
              <h4 style="font-size:1.25rem;color:var(--primary-800);margin:0 0 .25rem;">${org.org}</h4>
              <p class="muted" style="margin:.15rem 0 .35rem;">${org.duration || ''}</p>
              <p style="font-weight:700;margin:.2rem 0 1rem;">${org.role || ''}</p>
              <ul style="margin:0 0 0 1.25rem; padding:0; line-height:1.6;">
                ${(org.bullets || []).map(b => `<li>${b}</li>`).join('')}
              </ul>
            </div>
          `).join('');

          container.insertAdjacentHTML('beforeend', `
            <section id="${p.id}" class="section-container" aria-label="${p.title}">
              <div class="project-section">
                <h3 class="center" style="margin-bottom:1.25rem;">${p.title}</h3>
                ${orgsHTML}
              </div>
            </section>
          `);
        }
      });

      projects.forEach(p => { if (p.images && p.images.length > 0) showSlides(1, `${p.id}-slideshow`); });
      document.querySelectorAll('.section-container').forEach(s => observer.observe(s));
    }

    // Search filter
    document.addEventListener('input', e => {
      if (e.target.id === 'project-search') {
        filterByCategory(activeCategory);
        const query = e.target.value.toLowerCase();
        searchResults = allProjects.filter(p =>
          p.title.toLowerCase().includes(query) ||
          (p.skills && p.skills.toLowerCase().includes(query)) ||
          (p.categories && p.categories.some(c => c.toLowerCase().includes(query)))
        );
        highlightedIndex = -1;
        updateClearButton();
      }
    });

    // Clear button
    function updateClearButton() {
      const searchValue = document.getElementById('project-search').value.trim();
      const clearBtn = document.getElementById('clear-filters');
      if (searchValue || activeCategory) {
        clearBtn.style.display = 'inline-block';
      } else {
        clearBtn.style.display = 'none';
      }
    }

    document.addEventListener('click', e => {
      if (e.target.id === 'clear-filters') {
        const searchBox = document.getElementById('project-search');
        searchBox.value = '';
        filterByCategory(null);
        updateClearButton();
        searchBox.focus();
      }
    });

    // Keyboard: Enter = jump to first match
    document.addEventListener('keydown', e => {
      if (e.target.id === 'project-search' && e.key === 'Enter') {
        e.preventDefault();
        if (highlightedIndex >= 0 && searchResults[highlightedIndex]) {
          document.getElementById(searchResults[highlightedIndex].id).scrollIntoView({ behavior: 'smooth' });
        } else {
          const query = e.target.value.toLowerCase();
          if (!query) return;
          const firstMatch = allProjects.find(p =>
            p.title.toLowerCase().includes(query) ||
            (p.skills && p.skills.toLowerCase().includes(query)) ||
            (p.categories && p.categories.some(c => c.toLowerCase().includes(query)))
          );
          if (firstMatch) {
            document.getElementById(firstMatch.id).scrollIntoView({ behavior: 'smooth' });
          }
        }
      }
    });

    // Keyboard: / = focus search
    document.addEventListener('keydown', e => {
      if (e.key === '/' && document.activeElement.id !== 'project-search') {
        e.preventDefault();
        document.getElementById('project-search').focus();
      }
    });

    // Keyboard: arrow navigation in search results (visual highlight on grid buttons)
    document.addEventListener('keydown', e => {
      if (document.activeElement.id === 'project-search') {
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          if (searchResults.length > 0) {
            highlightedIndex = (highlightedIndex + 1) % searchResults.length;
            highlightResult();
          }
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          if (searchResults.length > 0) {
            highlightedIndex = (highlightedIndex - 1 + searchResults.length) % searchResults.length;
            highlightResult();
          }
        }
      }
    });

    function highlightResult() {
      const buttons = document.querySelectorAll('#projects-buttons .scroll-button');
      buttons.forEach(btn => btn.classList.remove('highlighted'));
      if (highlightedIndex >= 0 && highlightedIndex < searchResults.length) {
        const targetBtn = Array.from(buttons).find(btn => btn.textContent.trim() === searchResults[highlightedIndex].title);
        if (targetBtn) {
          targetBtn.classList.add('highlighted');
          targetBtn.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        }
      }
    }

    // Slideshow
    let slideIndex = {};
    function showSlides(n, slideshowId) {
      const slides = document.querySelectorAll(`#${slideshowId} .mySlides`);
      if (!slides.length) return;
      if (!slideIndex[slideshowId]) slideIndex[slideshowId] = 1;
      if (n > slides.length) slideIndex[slideshowId] = 1;
      if (n < 1) slideIndex[slideshowId] = slides.length;
      slides.forEach(s => s.style.display = 'none');
      slides[slideIndex[slideshowId]-1].style.display = 'block';
    }
    function plusSlides(n, slideshowId) {
      showSlides(slideIndex[slideshowId] += n, slideshowId);
    }
    // expose for inline handlers
    window.plusSlides = plusSlides; window.showSlides = showSlides;

    // Fade-in effect
    const observer = new IntersectionObserver((entries, obs) => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          e.target.classList.add('is-visible');
          obs.unobserve(e.target);
        }
      });
    }, { threshold: 0.1 });

    // Scroll progress + Back to Top
    const scrollProgress = document.getElementById('scroll-progress');
    const backToTopBtn = document.getElementById('back-to-top');
    const scrubTooltip = document.getElementById('scrub-tooltip');
    let isDragging = false;

    window.addEventListener('scroll', () => {
      const scrollTop = window.scrollY;
      const docHeight = document.documentElement.scrollHeight - window.innerHeight;
      const progress = (scrollTop / docHeight) * 100;

      scrollProgress.style.width = progress + '%';

      if (progress < 33) {
        scrollProgress.style.backgroundColor = 'var(--ok)';
        backToTopBtn.classList.remove('animate-soft-pulse');
      } else if (progress < 66) {
        scrollProgress.style.backgroundColor = 'var(--warn)';
        backToTopBtn.classList.remove('animate-soft-pulse');
      } else {
        scrollProgress.style.backgroundColor = 'var(--danger)';
        backToTopBtn.classList.add('animate-soft-pulse');
      }

      if (scrollTop > 400) {
        backToTopBtn.classList.add('is-visible');
      } else {
        backToTopBtn.classList.remove('is-visible', 'animate-soft-pulse');
      }
    });

    document.getElementById('back-to-top').addEventListener('click', () => {
      document.getElementById('hero').scrollIntoView({ behavior: 'smooth' });
    });

    // Scrubber (click + drag)
    scrollProgress.addEventListener('mousedown', e => { isDragging = true; handleScrub(e); });
    document.addEventListener('mousemove', e => { if (isDragging) handleScrub(e); });
    document.addEventListener('mouseup', () => { isDragging = false; scrubTooltip.classList.remove('is-visible'); });

    function handleScrub(e) {
      const pageWidth = window.innerWidth;
      const percentage = Math.max(0, Math.min(1, e.clientX / pageWidth));
      const docHeight = document.documentElement.scrollHeight - window.innerHeight;
      const targetScroll = docHeight * percentage;
      window.scrollTo({ top: targetScroll, behavior: 'auto' });
      updateTooltip(e, targetScroll);
    }

    // Hover support
    scrollProgress.addEventListener('mousemove', e => {
      const pageWidth = window.innerWidth;
      const percentage = Math.max(0, Math.min(1, e.clientX / pageWidth));
      const docHeight = document.documentElement.scrollHeight - window.innerHeight;
      const targetScroll = docHeight * percentage;
      updateTooltip(e, targetScroll);
    });
    scrollProgress.addEventListener('mouseleave', () => scrubTooltip.classList.remove('is-visible'));

    function updateTooltip(e, targetScroll) {
      const sections = document.querySelectorAll('#projects-container section');
      let nearest = null; let minDiff = Infinity;
      sections.forEach(sec => { const diff = Math.abs(sec.offsetTop - targetScroll); if (diff < minDiff) { minDiff = diff; nearest = sec; } });
      if (nearest) {
        tooltipTargetSection = nearest;
        const title = nearest.querySelector('h3, h2, h4')?.textContent || 'Section';
        scrubTooltip.textContent = title;
        const rect = scrubTooltip.getBoundingClientRect();
        scrubTooltip.style.left = (e.clientX - rect.width / 2) + 'px';
        scrubTooltip.classList.add('is-visible');
      }
    }

    // Tooltip click = scroll to section
    document.getElementById('scrub-tooltip').addEventListener('click', () => {
      if (tooltipTargetSection) tooltipTargetSection.scrollIntoView({ behavior: 'smooth' });
    });

    loadProjects();
  </script>
</body>
</html>
