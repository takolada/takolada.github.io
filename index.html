<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio of Fawaz Amajida</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #f9fafb, #e5e7eb, #f9fafb);
      background-size: 300% 300%;
      animation: movingBackground 15s ease infinite alternate;
      overflow-x: hidden;
      min-height: 100vh;
    }
    @keyframes movingBackground {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .section-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 4rem 2rem;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.8s ease-out, transform 0.8s ease-out;
    }
    .section-container.is-visible {
      opacity: 1;
      transform: translateY(0);
    }
    .project-section {
      background: white;
      border-radius: 1.5rem;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
      padding: 2.5rem;
      max-width: 900px;
      width: 95%;
      margin-bottom: 2rem;
    }
    .slideshow-container {
      position: relative;
      margin: 1.5rem auto;
      max-width: 700px;
      overflow: hidden;
      border-radius: 1rem;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
    .mySlides { display: none; width: 100%; }
    .prev, .next {
      cursor: pointer;
      position: absolute;
      top: 50%;
      padding: 12px;
      margin-top: -22px;
      color: white;
      font-weight: bold;
      font-size: 18px;
      background-color: rgba(0,0,0,0.6);
      border-radius: 5px;
      user-select: none;
    }
    .next { right: 0; }
    .embed-container {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      margin-top: 1.5rem;
    }
    .embed-container iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
    }
    @keyframes softPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.08); opacity: 0.9; }
    }
    .animate-soft-pulse {
      animation: softPulse 1.5s infinite;
    }
    #scrub-tooltip {
      transition: opacity 0.2s ease;
    }
  </style>
</head>
<body>

<!-- 📊 Scroll Progress Bar -->
<div id="scroll-progress"
     class="fixed top-0 left-0 h-2 w-0 z-50 rounded-r-full transition-all duration-75 cursor-pointer"></div>

<!-- 📌 Scrubber Tooltip -->
<div id="scrub-tooltip"
     class="hidden fixed top-4 text-xs bg-black text-white px-2 py-1 rounded shadow-lg pointer-events-auto cursor-pointer"></div>

<!-- Hero -->
<section id="hero" class="section-container">
  <div class="flex flex-col items-center">
    <img src="Assets/profile.jpg" alt="Fawaz Amajida"
         class="w-52 h-52 rounded-full object-cover shadow-xl mb-8 border-4 border-white">
    <h1 class="text-6xl font-extrabold mb-4">Fawaz Amajida</h1>
    <p class="text-2xl font-light max-w-3xl mb-10 text-center">
      A passionate Mechanical Engineer from Institut Teknologi Bandung, specializing in Engineering Design, Robotics, and Machine Learning.
    </p>
    <div class="flex space-x-6">
      <a href="https://www.linkedin.com/in/fawazamajida" target="_blank"
         class="bg-white text-blue-700 font-bold py-3 px-8 rounded-full shadow-lg hover:bg-gray-100">
         LinkedIn Profile
      </a>
      <a href="#projects" class="bg-white text-purple-700 font-bold py-3 px-8 rounded-full shadow-lg hover:bg-gray-100">
         View Projects
      </a>
    </div>
  </div>
</section>

<!-- Project Navigation + Filters -->
<section id="projects-nav" class="section-container bg-blue-50">
  <h2 class="text-5xl font-extrabold text-blue-800 mb-6 text-center">Explore My Work & Experiences</h2>

  <!-- 🔍 Search Bar + Clear -->
  <div class="mb-6 w-full max-w-md mx-auto flex gap-2">
    <input id="project-search" type="text"
           placeholder="Search projects or skills... (press / to focus)"
           class="flex-1 px-4 py-3 rounded-xl border border-gray-300 shadow-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" />
    <button id="clear-filters"
            class="px-4 py-3 bg-gray-200 text-gray-700 rounded-xl hover:bg-gray-300 transition hidden">
      Clear
    </button>
  </div>

  <!-- 🏷️ Category Filters -->
  <div id="category-filters" class="flex flex-wrap justify-center gap-3 mb-8"></div>

  <div id="projects-buttons" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 w-full max-w-5xl px-4"></div>
</section>

<!-- Projects Sections -->
<div id="projects-container"></div>

<!-- ⬆️ Back to Top Button -->
<button id="back-to-top"
        class="fixed bottom-6 right-6 bg-blue-600 text-white px-4 py-3 rounded-full shadow-lg hover:bg-blue-700 transition transform hover:scale-110 opacity-0 pointer-events-none">
  ⬆️
</button>

<script>
let allProjects = [];
let activeCategory = null;
let searchResults = [];
let highlightedIndex = -1;
let tooltipTargetSection = null;

// Load projects
async function loadProjects() {
  const res = await fetch('projects.json');
  allProjects = await res.json();
  renderCategoryFilters(allProjects);
  renderProjects(allProjects);
}

// Render category buttons
function renderCategoryFilters(projects) {
  const filterContainer = document.getElementById('category-filters');
  filterContainer.innerHTML = "";

  let categories = new Set();
  projects.forEach(p => (p.categories || []).forEach(c => categories.add(c)));

  filterContainer.insertAdjacentHTML("beforeend", `
    <button class="category-btn bg-blue-600 text-white px-4 py-2 rounded-lg shadow hover:bg-blue-700"
            onclick="filterByCategory(null)">All</button>
  `);

  categories.forEach(cat => {
    filterContainer.insertAdjacentHTML("beforeend", `
      <button class="category-btn bg-gray-200 text-gray-700 px-4 py-2 rounded-lg shadow hover:bg-blue-600 hover:text-white"
              onclick="filterByCategory('${cat}')">${cat}</button>
    `);
  });
}

// Filter by category
function filterByCategory(cat) {
  activeCategory = cat;
  const query = document.getElementById('project-search').value.toLowerCase();

  let filtered = allProjects.filter(p => {
    const matchesText =
      p.title.toLowerCase().includes(query) ||
      (p.skills && p.skills.toLowerCase().includes(query)) ||
      (p.categories && p.categories.some(c => c.toLowerCase().includes(query)));
    const matchesCategory = !cat || (p.categories && p.categories.includes(cat));
    return matchesText && matchesCategory;
  });

  renderProjects(filtered);

  document.querySelectorAll("#category-filters .category-btn").forEach(btn => {
    btn.classList.remove("bg-blue-600", "text-white");
    btn.classList.add("bg-gray-200", "text-gray-700");
  });

  if (cat === null) {
    document.querySelector("#category-filters .category-btn:first-child")
      .classList.add("bg-blue-600", "text-white");
  } else {
    document.querySelectorAll("#category-filters .category-btn").forEach(btn => {
      if (btn.textContent.trim() === cat) {
        btn.classList.add("bg-blue-600", "text-white");
      }
    });
  }

  updateClearButton();
}

// Render projects
function renderProjects(projects) {
  const buttons = document.getElementById('projects-buttons');
  const container = document.getElementById('projects-container');

  buttons.innerHTML = "";
  container.innerHTML = "";

  projects.forEach(p => {
    buttons.insertAdjacentHTML('beforeend', `
      <button class="scroll-button bg-blue-700 text-white py-4 px-6 rounded-xl shadow-md hover:bg-blue-800 transition"
              onclick="document.getElementById('${p.id}').scrollIntoView({behavior:'smooth'})">
        ${p.title}
      </button>
    `);

    if (!p.organizations) {
      // let embedsHTML = (p.embeds || []).map(url => `
      //   <div class="embed-container">
      //     <iframe src="${url}" frameborder="0" allowfullscreen></iframe>
      //   </div>`).join('');

      let embedsHTML = (p.embeds || [])
        .filter(url => !url.includes("digilib.itb.ac.id")) // 🚫 skip Digilib
        .map(url => `
          <div class="embed-container">
            <iframe src="${url}" frameborder="0" allowfullscreen></iframe>
          </div>`).join('');

      let imagesHTML = "";
      if (p.images && p.images.length > 0) {
        imagesHTML = `
          <div class="slideshow-container" id="${p.id}-slideshow">
            ${p.images.map(img => `<img class="mySlides" src="${img}">`).join("")}
            <a class="prev" onclick="plusSlides(-1, '${p.id}-slideshow')">❮</a>
            <a class="next" onclick="plusSlides(1, '${p.id}-slideshow')">❯</a>
          </div>
        `;
      }

      let categoryHTML = (p.categories || []).map(cat => `
        <button onclick="filterByCategory('${cat}')"
                class="inline-block bg-blue-100 hover:bg-blue-200 text-blue-700 text-sm font-medium px-3 py-1 rounded-full mr-2 mb-2 transition">
          ${cat}
        </button>
      `).join('');

      // 🔹 Render external links as buttons
      let linksHTML = "";
      if (p.links && p.links.length > 0) {
        linksHTML = `
          <div class="flex flex-wrap gap-3 mb-4">
            ${p.links.map(link => `
              <a href="${link.url}" target="_blank"
                 class="bg-blue-600 text-white px-4 py-2 rounded-lg shadow hover:bg-blue-700 transition">
                ${link.label}
              </a>
            `).join('')}
          </div>
        `;
      }

      container.insertAdjacentHTML('beforeend', `
        <section id="${p.id}" class="section-container bg-white">
          <div class="project-section">
            <h3 class="text-3xl font-bold mb-4 text-blue-800">${p.title}</h3>
            <span class="skills-list font-semibold text-blue-700">Skills: ${p.skills}</span>
            <p class="text-gray-700 mb-6">${p.description}</p>
            <div class="flex flex-wrap mb-4">${categoryHTML}</div>
            ${linksHTML}
            ${embedsHTML}
            ${imagesHTML}
          </div>
        </section>
      `);
    } else {
      let orgsHTML = p.organizations.map(org => `
        <div class="organizational-experience-item mb-8 pb-4 border-b border-gray-200">
          <h4 class="text-2xl font-semibold text-blue-700">${org.org}</h4>
          <p class="text-md text-gray-600 mb-1">${org.duration}</p>
          <p class="font-bold mb-3 text-lg">${org.role}</p>
          <ul class="list-disc ml-6 space-y-2 text-gray-700">
            ${org.bullets.map(b => `<li>${b}</li>`).join('')}
          </ul>
        </div>
      `).join('');

      container.insertAdjacentHTML('beforeend', `
        <section id="${p.id}" class="section-container bg-blue-50">
          <div class="project-section">
            <h3 class="text-4xl font-bold mb-8 text-blue-800 text-center">${p.title}</h3>
            ${orgsHTML}
          </div>
        </section>
      `);
    }
  });

  projects.forEach(p => {
    if (p.images && p.images.length > 0) {
      showSlides(1, `${p.id}-slideshow`);
    }
  });
}

// Search filter
document.addEventListener('input', e => {
  if (e.target.id === 'project-search') {
    filterByCategory(activeCategory);

    const query = e.target.value.toLowerCase();
    searchResults = allProjects.filter(p =>
      p.title.toLowerCase().includes(query) ||
      (p.skills && p.skills.toLowerCase().includes(query)) ||
      (p.categories && p.categories.some(c => c.toLowerCase().includes(query)))
    );
    highlightedIndex = -1;

    updateClearButton();
  }
});

// Clear button
function updateClearButton() {
  const searchValue = document.getElementById('project-search').value.trim();
  const clearBtn = document.getElementById('clear-filters');
  if (searchValue || activeCategory) {
    clearBtn.classList.remove("hidden");
  } else {
    clearBtn.classList.add("hidden");
  }
}

document.addEventListener('click', e => {
  if (e.target.id === 'clear-filters') {
    const searchBox = document.getElementById('project-search');
    searchBox.value = "";
    filterByCategory(null);
    updateClearButton();
    searchBox.focus();
  }
});

// Keyboard: Enter = jump to first match
document.addEventListener('keydown', e => {
  if (e.target.id === 'project-search' && e.key === 'Enter') {
    e.preventDefault();
    if (highlightedIndex >= 0 && searchResults[highlightedIndex]) {
      document.getElementById(searchResults[highlightedIndex].id)
        .scrollIntoView({ behavior: 'smooth' });
    } else {
      const query = e.target.value.toLowerCase();
      if (!query) return;
      const firstMatch = allProjects.find(p =>
        p.title.toLowerCase().includes(query) ||
        (p.skills && p.skills.toLowerCase().includes(query)) ||
        (p.categories && p.categories.some(c => c.toLowerCase().includes(query)))
      );
      if (firstMatch) {
        document.getElementById(firstMatch.id)
          .scrollIntoView({ behavior: 'smooth' });
      }
    }
  }
});

// Keyboard: / = focus search
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement.id !== 'project-search') {
    e.preventDefault();
    document.getElementById('project-search').focus();
  }
});

// Keyboard: arrow navigation in search results
document.addEventListener('keydown', e => {
  if (document.activeElement.id === 'project-search') {
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (searchResults.length > 0) {
        highlightedIndex = (highlightedIndex + 1) % searchResults.length;
        highlightResult();
      }
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (searchResults.length > 0) {
        highlightedIndex = (highlightedIndex - 1 + searchResults.length) % searchResults.length;
        highlightResult();
      }
    }
  }
});

function highlightResult() {
  const buttons = document.querySelectorAll('#projects-buttons button');
  buttons.forEach(btn => btn.classList.remove("ring-2", "ring-blue-500", "scale-105"));
  if (highlightedIndex >= 0 && highlightedIndex < searchResults.length) {
    const targetBtn = Array.from(buttons).find(btn =>
      btn.textContent.trim() === searchResults[highlightedIndex].title
    );
    if (targetBtn) {
      targetBtn.classList.add("ring-2", "ring-blue-500", "scale-105");
      targetBtn.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
  }
}

// Slideshow
let slideIndex = {};
function showSlides(n, slideshowId) {
  let slides = document.querySelectorAll(`#${slideshowId} .mySlides`);
  if (!slides.length) return;
  if (!slideIndex[slideshowId]) slideIndex[slideshowId] = 1;
  if (n > slides.length) slideIndex[slideshowId] = 1;
  if (n < 1) slideIndex[slideshowId] = slides.length;
  slides.forEach(s => s.style.display = "none");
  slides[slideIndex[slideshowId]-1].style.display = "block";
}
function plusSlides(n, slideshowId) {
  showSlides(slideIndex[slideshowId] += n, slideshowId);
}

// Fade-in effect
const observer = new IntersectionObserver((entries, obs) => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      e.target.classList.add('is-visible');
      obs.unobserve(e.target);
    }
  });
}, { threshold: 0.1 });
document.querySelectorAll('.section-container').forEach(s => observer.observe(s));

// Scroll progress + Back to Top
const scrollProgress = document.getElementById('scroll-progress');
const backToTopBtn = document.getElementById('back-to-top');
const scrubTooltip = document.getElementById('scrub-tooltip');
let isDragging = false;

window.addEventListener('scroll', () => {
  const scrollTop = window.scrollY;
  const docHeight = document.documentElement.scrollHeight - window.innerHeight;
  const progress = (scrollTop / docHeight) * 100;

  scrollProgress.style.width = progress + "%";

  if (progress < 33) {
    scrollProgress.style.backgroundColor = "#22c55e";
    backToTopBtn.classList.remove("animate-soft-pulse");
  } else if (progress < 66) {
    scrollProgress.style.backgroundColor = "#eab308";
    backToTopBtn.classList.remove("animate-soft-pulse");
  } else {
    scrollProgress.style.backgroundColor = "#ef4444";
    backToTopBtn.classList.add("animate-soft-pulse");
  }

  if (scrollTop > 400) {
    backToTopBtn.classList.remove('opacity-0', 'pointer-events-none');
    backToTopBtn.classList.add('opacity-100');
  } else {
    backToTopBtn.classList.add('opacity-0', 'pointer-events-none');
    backToTopBtn.classList.remove('opacity-100', 'animate-soft-pulse');
  }
});

backToTopBtn.addEventListener('click', () => {
  document.getElementById('hero').scrollIntoView({ behavior: 'smooth' });
});

// Scrubber (click + drag)
scrollProgress.addEventListener('mousedown', e => {
  isDragging = true;
  handleScrub(e);
});
document.addEventListener('mousemove', e => {
  if (isDragging) handleScrub(e);
});
document.addEventListener('mouseup', () => {
  isDragging = false;
  scrubTooltip.classList.add("hidden");
});

function handleScrub(e) {
  const pageWidth = window.innerWidth;
  const percentage = Math.max(0, Math.min(1, e.clientX / pageWidth));
  const docHeight = document.documentElement.scrollHeight - window.innerHeight;
  const targetScroll = docHeight * percentage;
  window.scrollTo({ top: targetScroll, behavior: 'auto' });

  updateTooltip(e, targetScroll);
}

// Hover support
scrollProgress.addEventListener('mousemove', e => {
  const pageWidth = window.innerWidth;
  const percentage = Math.max(0, Math.min(1, e.clientX / pageWidth));
  const docHeight = document.documentElement.scrollHeight - window.innerHeight;
  const targetScroll = docHeight * percentage;

  updateTooltip(e, targetScroll);
});

scrollProgress.addEventListener('mouseleave', () => {
  scrubTooltip.classList.add("hidden");
});

function updateTooltip(e, targetScroll) {
  const sections = document.querySelectorAll('#projects-container section');
  let nearest = null;
  let minDiff = Infinity;

  sections.forEach(sec => {
    const diff = Math.abs(sec.offsetTop - targetScroll);
    if (diff < minDiff) {
      minDiff = diff;
      nearest = sec;
    }
  });

  if (nearest) {
    tooltipTargetSection = nearest;
    const title = nearest.querySelector('h3, h2, h4')?.textContent || "Section";
    scrubTooltip.textContent = title;
    scrubTooltip.style.left = (e.clientX - scrubTooltip.offsetWidth / 2) + "px";
    scrubTooltip.classList.remove("hidden");
  }
}

// Tooltip click = scroll to section
scrubTooltip.addEventListener('click', () => {
  if (tooltipTargetSection) {
    tooltipTargetSection.scrollIntoView({ behavior: 'smooth' });
  }
});

loadProjects();
</script>
</body>
</html>
